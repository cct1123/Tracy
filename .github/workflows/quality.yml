name: Engineering validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:physics
      - run: npm run reference:check
      - run: npm run wavefront:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Production build and Worker smoke test
        run: npm run test:e2e -- --grep startup
        env:
          TRACY_E2E_DIST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-and-physics-evidence
          path: |
            test-results/
            playwright-report/
            tests/fixtures/reference-comparison.json
            outputs/wavefront-comparison.json
